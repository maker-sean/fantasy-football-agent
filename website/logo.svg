<!--
  Commish lockup.

  COMMISH set in Chakra Petch Bold Italic (SIL Open Font License) and OUTLINED
  to paths. Nothing loads at runtime: this site makes zero external requests,
  which the privacy policy states, and a webfont would break that. Outlining
  also means the mark renders identically everywhere and stays sharp at any size.

  The -10 degree lean is the typeface's own designed italic, not a skew. A skew
  distorts the curves; a designed italic redraws them.

  The bubble is the bot's own typing indicator, geometry matching
  .msg.bot .bubble and .typing in styles.css, tail corner included.

  Wordmark takes currentColor. The bubble is fixed green because it is the mark.
  Regenerating: see scripts, or re-outline from the same font at 0.01em tracking.
-->
