# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One background worker. Not a web service: inbound comes from polling, so there
# is no port to bind and no health check to serve. A free Render *web* service
# would also sleep on inactivity, which would stop the poller and every kickoff
# capture with it — the exact failure this deployment exists to prevent.
#
# Apply with:  Render Dashboard → New → Blueprint → point at this repo
# Secrets are NOT in this file. `sync: false` means Render prompts for the value
# once and stores it; it never lands in git.

services:
  # The commissioner app and the marketing site, one origin. Unlike the worker
  # this one binds a port and answers a health check, so a free plan's sleeping
  # would only add a cold start to a signup — not stop a kickoff capture.
  - type: web
    name: commish-web
    runtime: node
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm run web
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # Supabase Auth. The browser gets a token; the server asks Supabase who it
      # belongs to. No signing secret here and no hand-rolled crypto.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Shown on the "add me to your group chat" screen.
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      # Operator allowlist for /admin, comma separated emails.
      #
      # sync:false so the dashboard owns it, like REPLY_DRY_RUN and ECHO. A
      # literal value here would be re-applied on every deploy, which is how
      # this repo has twice had a setting silently reset underneath it.
      #
      # Unset means /api/admin is closed to everyone, which is the intended
      # default: a forgotten variable must not become an open door over other
      # people's group chats.
      - key: ADMIN_EMAILS
        sync: false

      # Signs the per-member voting links. MUST be byte-identical to the
      # worker's copy: the worker mints, this verifies, and a mismatch makes
      # every link 404 with nothing in either log to explain it.
      - key: BALLOT_SECRET
        sync: false
      # Origin the links are built from. Unset falls back to RENDER_EXTERNAL_URL,
      # which Render injects and which is already a real https origin — no
      # domain purchase is on this feature's critical path.
      - key: PUBLIC_BASE_URL
        sync: false

      - key: TERMS_VERSION
        value: "2026-08-16"
      - key: NODE_ENV
        value: production

  - type: worker
    name: commish-agent-worker
    runtime: node
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true

    buildCommand: npm ci --omit=dev
    startCommand: npm run worker

    # ONE instance, always. Two pollers double-process every message and the bot
    # answers twice — the message insert is idempotent so nothing corrupts, but
    # the league sees it.
    numInstances: 1

    envVars:
      # --- secrets: set once in the Render dashboard ---
      - key: DATABASE_URL
        sync: false
      - key: SENDBLUE_API_KEY_ID
        sync: false
      - key: SENDBLUE_API_SECRET_KEY
        sync: false
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Same value as commish-web. See the note there.
      - key: BALLOT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

      # Where operator alerts go. A signup used to leave nothing but a
      # console.log, and the dashboard shows counts rather than who, so the only
      # way to learn somebody was waiting was to open a terminal. Unset means
      # alerts are off, which is a valid deployment.
      - key: OPERATOR_PHONE
        sync: false

      # --- behavior ---
      # NFL slates are Eastern. Wrong timezone means kickoff captures fire at the
      # wrong hour and lineups are lost with no error.
      - key: CRON_TZ
        value: America/New_York

      # Operational toggles: sync:false so the DASHBOARD owns them.
      #
      # These were literal values, and Render re-applies blueprint values on
      # every deploy — so turning the bot on in the dashboard worked until the
      # next push silently reset it to dry-run. The bot went quiet and nothing
      # reported it, because dry-run is a deliberate silence and looks exactly
      # like a working system with nothing to say.
      #
      # Start them at true/false in the dashboard; flip when ready.
      - key: REPLY_DRY_RUN
        sync: false

      - key: ECHO
        sync: false

      - key: POLL_INTERVAL_SECONDS
        value: "10"
      # Words per MESSAGE, not per recap. A recap may be two short texts.
      # Pinned here rather than left to the code default so the deployed value
      # is visible in the blueprint; change it in both places or not at all.
      - key: RECAP_WORDS
        value: "60"
      - key: NODE_ENV
        value: production
